    <!-- en el cruce inferior, el signo de atrás pasa por encima -->
    <path d="M 76.44 255.48 A 128 128 0 0 1 -32.28 171.78" fill="none" stroke="url(#knock)" stroke-width="94"/>
    <path d="M 85.36 255.97 A 128 128 0 0 1 -32.28 171.78" fill="none" stroke="#b89c63" stroke-width="64"/>
  </g>
