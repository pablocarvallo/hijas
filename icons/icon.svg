<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2024"/>
      <stop offset="1" stop-color="#131619"/>
    </linearGradient>
    <linearGradient id="knock" gradientUnits="userSpaceOnUse" x1="0" y1="-512" x2="0" y2="512">
      <stop offset="0" stop-color="#1c2024"/>
      <stop offset="1" stop-color="#131619"/>
    </linearGradient>
    <clipPath id="rr"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <g clip-path="url(#rr)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512)">
    <!-- signo de atrás -->
    <rect x="56.0" y="-338.0" width="64" height="82.0" fill="#b89c63"/><rect x="56.0" y="256.0" width="64" height="82.0" fill="#b89c63"/><path d="M 208.28 -171.78 A 128 128 0 1 0 88.0 0 A 128 128 0 1 1 -32.28 171.78" fill="none" stroke="#b89c63" stroke-width="64"/>
    <!-- signo de adelante: pasa por encima en el cruce superior -->
