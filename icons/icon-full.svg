<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2358"/>
      <stop offset="1" stop-color="#14123a"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="40%" r="62%">
      <stop offset="0" stop-color="#6c63d6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6c63d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0.15" y1="0" x2="0.85" y2="1">
