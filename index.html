.pc { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border-radius: 24px; background: var(--ds-surface); box-shadow: var(--ds-shadow-1); color: var(--ds-ink); font-family: var(--ds-font); text-align: left; }
.pc-head { display: flex; align-items: center; gap: 12px; }

.pc-ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(150deg, #7AA4F7 0%, #4D78F3 46%, #2950F4 100%); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.pc-ic svg { display: block; }
.pc-st { font-size: 13px; line-height: 1.3; color: var(--ds-ink-2); }
.pc-ok { color: var(--ds-pos); font-weight: 600; }
.pc-bad { color: var(--ds-neg); font-weight: 600; }
.pc-p { margin: 0; font-size: 15px; line-height: 1.38; color: var(--ds-ink-2); }
.pc-btns { display: flex; gap: 10px; }
.pc-btn { flex: 1; min-width: 0; min-height: 42px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--ds-tint-soft); color: var(--ds-tint); font: 600 15px/1 var(--ds-font); letter-spacing: -0.01em; cursor: pointer; -webkit-appearance: none; appearance: none; transition: transform 0.16s ease; }
.pc-btn:active { transform: scale(0.97); }
.pc-main { background: var(--ds-btn); color: var(--ds-on-btn); box-shadow: var(--ds-shadow-btn); }
.pc-danger { background: var(--ds-neg-soft); color: var(--ds-neg); }
.pc-armed { background: var(--ds-neg); color: #fff; }
.pc-ta { display: block; width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid transparent; border-radius: 14px; background: var(--ds-surface-2); color: var(--ds-ink); font: 13px/1.4 var(--ds-font-mono); resize: vertical; -webkit-appearance: none; appearance: none; }
.pc-ta:focus { outline: none; border-color: var(--ds-tint); box-shadow: 0 0 0 4px var(--ds-tint-soft); }
.pc-err { margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--ds-neg-soft); color: var(--ds-neg); font-size: 15px; font-weight: 600; }
.pc-err[hidden] { display: none; }

/* Concepto: arriba el total de cada hija, lado a lado; debajo el formulario para anotar

/*DS:TOKENS:START*/
/* ── Domésticas · sistema de diseño común (v1) ──────────────────────────────

   Estilo iOS 27: tipografía del sistema (SF Pro), tarjetas blancas sobre fondo agrupado,
   barras y botones de vidrio, cápsulas, esquinas amplias. Igual en todas las apps de la casa. */
:root {
  --ds-b1: #2950F4; --ds-b2: #4D78F3; --ds-b3: #719DF6; --ds-b4: #99C2F8; --ds-b5: #BDEBFB; --ds-navy: #182D4A;

  --ds-font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ds-r-card: 24px; --ds-r-inner: 16px; --ds-r-field: 14px; --ds-r-sheet: 34px; --ds-r-pill: 999px;

  --ds-bg: #EFF3FB;
  --ds-bg-top: #DFE9FD;
  --ds-surface: #FFFFFF;
  --ds-surface-2: #F3F6FD;
  --ds-fill: rgba(41, 80, 244, 0.07);
  --ds-fill-2: rgba(41, 80, 244, 0.13);
  --ds-ink: #0E1B33;
  --ds-ink-2: #55617A;
  --ds-ink-3: #8691A8;
  --ds-line: rgba(24, 45, 74, 0.12);
  --ds-line-2: rgba(24, 45, 74, 0.2);
  --ds-tint: #2950F4;
  --ds-tint-soft: #E5ECFE;
  --ds-btn: #2950F4;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #157A43; --ds-pos-soft: #DDF4E6;
  --ds-neg: #D1281C; --ds-neg-soft: #FDE8E6;
  --ds-warn: #A35500; --ds-warn-soft: #FFF0D9;
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.45) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #4D78F3 0%, #2950F4 58%, #2141D6 100%);
  --ds-hero-ink: #FFFFFF;
  --ds-hero-ink-2: rgba(255, 255, 255, 0.84);
  --ds-hero-line: rgba(255, 255, 255, 0.28);
  --ds-hero-glass: rgba(255, 255, 255, 0.18);
  --ds-glass: rgba(255, 255, 255, 0.7);
  --ds-glass-strong: rgba(255, 255, 255, 0.86);
  --ds-glass-line: rgba(255, 255, 255, 0.85);
  --ds-glass-edge: rgba(14, 27, 51, 0.1);
  --ds-glass-blur: blur(22px) saturate(1.8);
  --ds-shadow-1: 0 1px 2px rgba(24, 45, 74, 0.05), 0 4px 14px rgba(24, 45, 74, 0.05);
  --ds-shadow-2: 0 12px 32px rgba(24, 45, 74, 0.16), 0 2px 8px rgba(24, 45, 74, 0.08);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 16px rgba(41, 80, 244, 0.26);
  --ds-scrim: rgba(14, 27, 51, 0.36);
  --ds-chart-1: #2950F4; --ds-chart-2: #719DF6; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: light;
}

  --ds-glass: rgba(24, 40, 70, 0.62);

}
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 340px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.012em;
}
/* ── fin de los tokens comunes ── */

/* Variables propias de las apps de cuentas, ahora tomadas del sistema común */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-ds]), :root[data-theme] {
  --bg: var(--ds-bg); --surface: var(--ds-surface); --ink: var(--ds-ink); --muted: var(--ds-ink-2); --line: var(--ds-line-2);
  --track: var(--ds-fill); --seg-on: var(--ds-surface); --accent: var(--ds-tint); --accent-bg: var(--ds-tint-soft); --on-accent: var(--ds-on-btn);
  --in: var(--ds-pos); --in-bg: var(--ds-pos-soft); --over: var(--ds-neg); --over-bg: var(--ds-neg-soft);
  --card-a: var(--ds-b2); --card-b: var(--ds-b1); --card-shade: rgba(14, 27, 80, 0.32); --card-edge: rgba(255, 255, 255, 0.22);
  --on-card: var(--ds-hero-ink); --on-card-muted: var(--ds-hero-ink-2); --on-card-line: var(--ds-hero-line);
  --lime: #FFFFFF; --lime-ink: var(--ds-b1); --warn-soft: #FFE3A3; --busy: #F5A524; --scrim: var(--ds-scrim);
  --gold: var(--ds-b5); --gold-soft: #FFE3A3; --gold-line: var(--ds-b2);
  --ember: var(--ds-b5); --amber: #FFE3A3; --alarm: #FF8A80;
  --dot-1: var(--ds-b5); --dot-2: var(--ds-b4); --dot-3: var(--ds-b3); --dot-4: #FFFFFF;
  --tit: var(--ds-b1); --tit-ink: #2141D6; --tit-bg: var(--ds-tint-soft);
  --adi: #2E9BD6; --adi-ink: #146896; --adi-bg: #DDF3FC;
  --font-display: var(--ds-font-display); --font-body: var(--ds-font);
  --piti: #2950F4; --piti-bg: #E5ECFE; --emi: #0B85BD; --emi-bg: #DCF2FB; --on-person: #FFFFFF;
  --done: var(--ds-pos); --done-bg: var(--ds-pos-soft); --on-done: #FFFFFF; --warn: var(--ds-warn);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --on-person: #0A1224; --on-done: #0A1224;
    --tit: #8EB0FA; --tit-ink: #B9CDFC; --tit-bg: rgba(113, 157, 246, 0.18);
    --adi: #7FD3F5; --adi-ink: #BDEBFB; --adi-bg: rgba(127, 211, 245, 0.15);
  }
}
:root[data-theme="dark"] {
    --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --on-person: #0A1224; --on-done: #0A1224;
  --tit: #8EB0FA; --tit-ink: #B9CDFC; --tit-bg: rgba(113, 157, 246, 0.18);
  --adi: #7FD3F5; --adi-ink: #BDEBFB; --adi-bg: rgba(127, 211, 245, 0.15);
}

/*DS:TOKENS:END*/html { -webkit-tap-highlight-color: transparent; }
html.lock { overflow: hidden; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 480px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.muted { color: var(--muted); margin: 0; }
svg { display: block; }

/* Colores por persona */
.piti { --who: var(--piti); --who-bg: var(--piti-bg); }
.emi { --who: var(--emi); --who-bg: var(--emi-bg); }
.person { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--who-bg); color: var(--who); font-weight: 600; font-size: 13px; }

/* Encabezado */
.top { display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.top h1 { font-size: 28px; font-weight: 700; line-height: 1.1; }

/* Totales */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--who); border-radius: 18px; padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.tile .person { font-size: 14px; min-height: 26px; padding: 0 12px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--ink); max-width: 100%; overflow-wrap: anywhere; }
.big.s2 { font-size: 27px; }
.big.s3 { font-size: 22px; }
.tile .sub { font-size: 13px; color: var(--muted); }
.tile.bump { animation: bump 0.9s ease-out; }
@keyframes bump { 0% { background: var(--who-bg); transform: scale(1.03); } 100% { background: var(--surface); transform: none; } }
.grand { margin: 10px 4px 0; font-size: 14px; color: var(--muted); }
.grand strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Aviso del último aporte */
.result { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--who-bg); color: var(--ink); font-size: 15px; }
.result strong { font-weight: 600; font-variant-numeric: tabular-nums; }
.result .new { display: block; margin-top: 2px; color: var(--who); font-weight: 600; }

/* Botones */
.btn {
  min-height: 52px; padding: 0 20px; border-radius: 14px; border: 1.5px solid transparent;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { opacity: 0.85; }
.btn.primary { background: var(--accent, var(--ink)); color: var(--on-accent, var(--bg)); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.danger { background: transparent; border-color: var(--over); color: var(--over); }
.btn.danger.armed { background: var(--over); color: var(--bg); }
.btn.block { width: 100%; }

/* Formulario */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-size: 22px; }
.sel-piti { --accent: var(--piti); --on-accent: var(--on-person); }
.sel-emi { --accent: var(--emi); --on-accent: var(--on-person); }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend { font-size: 14px; font-weight: 600; padding: 0; }
.field input[type="date"], .field input[type="text"] {
  display: block; width: 100%; min-width: 0; min-height: 52px; box-sizing: border-box;
  -webkit-appearance: none; appearance: none; font-size: 16px;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); color: var(--ink);
}
.field input::placeholder { color: var(--muted); opacity: 0.75; }
.amount-wrap { position: relative; }
.amount-wrap b { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--muted); pointer-events: none; }
.amount-wrap input[type="text"] { min-height: 64px; padding-left: 40px; font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.who { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.who input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.who label {
  min-height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--who);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; cursor: pointer;
}
.who input:checked + label { background: var(--who); border-color: var(--who); color: var(--on-person); }
.who input:focus-visible + label { outline: 3px solid var(--ink); outline-offset: 2px; }
.sugs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -6px; }
.sug { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-size: 15px; font-weight: 500; }
.sug:active { background: var(--track); }
.field.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.field.inline input[type="date"] { width: auto; flex: 0 1 190px; min-height: 48px; }
.err { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--over-bg); color: var(--over); font-weight: 600; font-size: 15px; }

/* Historial */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 22px; }
.filter { display: flex; gap: 6px; }
.fchip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-size: 14px; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.hist { display: flex; flex-direction: column; gap: 10px; }
.month { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 4px 0; font-family: var(--font-body); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.month span { font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--ink); font-size: 14px; }

  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 448px; margin: 0 auto; z-index: 20;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 15px; text-align: center;

<div class="toast" id="toast" role="status" hidden></div>

<script>
/*PANEL:START*/
/* Panel Casa: publica en el buzón privado de GitHub un resumen de esta app, para que Panel Casa lo muestre.
   Es el mismo código en Pagos del mes, Balón de gas, Mi cápsula diaria y Mesadas. No se edita en la app:
   se copia desde casa/herramientas/panel-casa.js con  python3 herramientas/conectar-apps.py <carpeta de las apps>
   Uso: PanelCasa.init({ app, title, mount, summary }) al abrir la app y PanelCasa.changed() cada vez que se guarda. */
var PanelCasa = (function () {
  'use strict';
  var KEY = 'panel-casa', REPO_RE = /^[\w.-]+\/[\w.-]+$/;
  var opts = null, cfg = read(), timer = 0, busy = false, again = false, armed = false, editing = false;

  function read() {
    try {
      var c = JSON.parse(localStorage.getItem(KEY) || 'null');
      return c && REPO_RE.test(String(c.r || '')) && typeof c.t === 'string' && c.t.length >= 20 ? c : null;
    } catch (e) { return null; }
  }
  function write() { try { if (cfg) localStorage.setItem(KEY, JSON.stringify(cfg)); else localStorage.removeItem(KEY); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(ms) {
    var d = new Date(ms), n = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    var y = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
    var day = d.toDateString() === n.toDateString() ? 'hoy' : d.toDateString() === y.toDateString() ? 'ayer'
      : d.getDate() + ' ' + ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][d.getMonth()];
    return day + ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---------- Publicar ---------- */
  async function gh(method, path, body, keep, conn) {
    var c = conn || cfg;
    var r = await fetch('https://api.github.com/repos/' + c.r + path, {
      method: method, cache: 'no-store', keepalive: !!keep,
      headers: { Authorization: 'Bearer ' + c.t, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) { var e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  }
  // El resumen va en la descripción de un hito cerrado con el nombre de la app (por ejemplo «Gas · panel»)
  async function send(desc, retried) {
    if (!cfg.m) {
      var list = await gh('GET', '/milestones?state=all&per_page=100');
      var f = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.title === opts.title; })[0];
      if (!f) { cfg.m = (await gh('POST', '/milestones', { title: opts.title, state: 'closed', description: desc })).number; return; }
      cfg.m = f.number;
    }
    try { await gh('PATCH', '/milestones/' + cfg.m, { description: desc }, true); }
    catch (e) { if (e.status === 404 && !retried) { cfg.m = 0; return send(desc, true); } throw e; }
  }
  async function flush() {
    clearTimeout(timer); timer = 0;
    if (!cfg || !opts) return;
    if (busy) { again = true; return; }
    var data;
    try { data = opts.summary(); } catch (e) { data = null; }
    if (!data) return;
    var body = JSON.stringify(data);
    if (body === cfg.h && !cfg.err) return;          // nada cambió desde la última vez
    busy = true;
    var full = { app: opts.app, v: 1, at: Date.now() };
    Object.keys(data).forEach(function (k) { full[k] = data[k]; });
    try { await send(JSON.stringify(full)); cfg.h = body; cfg.ok = full.at; cfg.err = 0; }
    catch (e) { cfg.err = (e && e.status) || 1; }
    if (cfg) write();
    busy = false; paint();
    if (again) { again = false; flush(); }
  }
  function changed() { if (cfg && opts) { clearTimeout(timer); timer = setTimeout(flush, 1200); } }

  /* ---------- Vista: tarjeta «Panel Casa» al final de la app ---------- */
  var I_HOUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.5 11.2L12 4l8.5 7.2V20a1 1 0 0 1-1 1h-5v-5.5h-5V21h-5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  function status() {
    if (!cfg) return '';
    if (busy) return '<span class="pc-st">Publicando…</span>';
    if (cfg.err === 401) return '<span class="pc-st pc-bad">El token venció: pega un código nuevo</span>';
    if (cfg.err === 403) return '<span class="pc-st pc-bad">El token no puede escribir en el buzón</span>';
    if (cfg.err === 404) return '<span class="pc-st pc-bad">No se encontró el buzón</span>';
    if (cfg.err) return '<span class="pc-st pc-bad">Sin conexión: se publicará al próximo cambio</span>';
    return '<span class="pc-st pc-ok">' + (cfg.ok ? 'Publicó ' + esc(when(cfg.ok)) : 'Conectada') + '</span>';
  }
  function paint() {
    var el = opts && opts.mount;
    if (!el) return;
    var h = '<section class="pc" aria-label="Panel Casa"><div class="pc-head"><span class="pc-ic">' + I_HOUSE + '</span><div><b>Panel Casa</b>' +
      (cfg ? status() : '<span class="pc-st">Sin conectar</span>') + '</div></div>';
    if (cfg && !editing) {
      h += '<p class="pc-p">Lo que anotas aquí se ve también en Panel Casa.</p><div class="pc-btns">' +
        '<button type="button" class="pc-btn" data-pc="now">Publicar ahora</button>' +
        '<button type="button" class="pc-btn pc-danger' + (armed ? ' pc-armed' : '') + '" data-pc="off">' + (armed ? 'Toca de nuevo' : 'Desconectar') + '</button></div>';
    } else {
      h += '<p class="pc-p">Para ver esta app en Panel Casa: en el panel, abre Conexiones y toca «Copiar código para las apps». Luego vuelve aquí.</p>';
      if (editing) {
        h += '<textarea class="pc-ta" id="pc-ta" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Pega aquí el código (empieza con CASA1.)"></textarea>' +
          '<div class="pc-btns"><button type="button" class="pc-btn pc-main" data-pc="save">Conectar</button><button type="button" class="pc-btn" data-pc="cancel">Cancelar</button></div>';
      } else {
        h += '<div class="pc-btns"><button type="button" class="pc-btn pc-main" data-pc="paste">Pegar código</button></div>';
      }
      h += '<p class="pc-err" id="pc-err" hidden></p>';
    }
    el.innerHTML = h + '</section>';
  }
  function parseCode(text) {
    var m = /CASA1\.([A-Za-z0-9+\/=]+)/.exec(String(text || ''));
    if (!m) return null;
    try {
      var o = JSON.parse(atob(m[1]));
      return o && REPO_RE.test(String(o.r || '')) && typeof o.t === 'string' && o.t.trim().length >= 20 ? { r: String(o.r), t: o.t.trim() } : null;
    } catch (e) { return null; }
  }
  function connect(text) {
    var c = parseCode(text);
    if (!c) return false;
    cfg = { r: c.r, t: c.t, m: 0, h: '', ok: 0, err: 0 };
    editing = false; write(); paint(); flush();
    return true;
  }
  function showErr(msg) { var e = document.getElementById('pc-err'); if (e) { e.textContent = msg; e.hidden = false; } }
  function onClick(ev) {
    var b = ev.target.closest && ev.target.closest('[data-pc]');
    if (!b || !opts || !opts.mount.contains(b)) return;
    var a = b.getAttribute('data-pc');
    if (a === 'paste') {
      // Primero intenta leer el portapapeles; si el iPhone no lo permite, muestra un campo para pegar
      var manual = function () { editing = true; paint(); var t = document.getElementById('pc-ta'); if (t) t.focus(); };
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (txt) { if (!connect(txt)) manual(); }, manual);
      } else manual();
    } else if (a === 'save') {
      var t = document.getElementById('pc-ta');
      if (!connect(t ? t.value : '')) showErr('Ese no es el código del panel. Cópialo de nuevo en Panel Casa → Conexiones.');
    } else if (a === 'cancel') { editing = false; paint(); }
    else if (a === 'now') { if (cfg) { cfg.h = ''; flush(); paint(); } }
    else if (a === 'off') {
      if (!armed) { armed = true; paint(); setTimeout(function () { armed = false; paint(); }, 4000); return; }
      armed = false;
      var old = cfg; cfg = null; write(); paint();
      // El hito queda vacío para que el panel no siga mostrando datos viejos
      if (old && old.m) gh('PATCH', '/milestones/' + old.m, { description: '' }, null, false, old).catch(function () {});
    }
  }

  function init(o) {
    opts = o;
    if (!opts || typeof opts.summary !== 'function') return;
    if (opts.mount) { paint(); opts.mount.addEventListener('click', onClick); }
    if (cfg) setTimeout(flush, 1500);
    // Al salir de la app se publica lo que esté pendiente
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && timer) flush(); });
  }
  return { init: init, changed: changed };
})();
/*PANEL:END*/
</script>
<script>
(function () {
  'use strict';

  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var MES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  var LS_KEY = 'mesadas-aportes';
  var PEOPLE = { piti: 'Piti', emi: 'Emi' };
  var ORDER = ['piti', 'emi'];
  var DEFAULT_SUGS = ['Almuerzo', 'Ropa', 'Helados'];
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var PAGE = 40;

  var I_CHEV = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var $ = function (id) { return document.getElementById(id); };
  var totalsEl = $('totals'), resultEl = $('result'), formEl = $('new-form'), historyEl = $('history');
  var backupEl = $('backup'), sheetEl = $('sheet'), toastEl = $('toast');

  var items = [];
  var loading = !!(window.claude && window.claude.use);
  var mode = 'local';
  var db = null;
  var sheet = null;
  var busy = false;
  var restoreArmed = false;
  var filter = 'all';
  var shown = PAGE;
  var bumpWho = null;
  var lastToday = '';

  /* ---------- Fechas y formatos ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDay(k) { var p = k.split('-'); return (+p[2]) + ' ' + MES[+p[1] - 1]; }
  function monthLabel(k) { return MES_L[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4); }
  function dots(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function money(n) { return '$' + dots(Math.round(n)); }
  function plural(n, s, p) { return n === 1 ? s : p; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function genId() { return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function cleanSubject(s) {
    s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 40);
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  }
  function parseAmount(s) { var d = String(s).replace(/\D/g, '').slice(0, 9); return d ? parseInt(d, 10) : 0; }

  /* ---------- Datos ---------- */
  function norm(r) {
    if (!r || !PEOPLE[r.who] || !DATE_RE.test(String(r.date))) return null;
    var amount = Math.round(+r.amount);
    if (!(amount > 0) || amount > 999999999) return null;
    var id = String(r.id || '').replace(/[^\w-]/g, '') || genId();
    return { id: id, who: r.who, amount: amount, subject: cleanSubject(r.subject), date: String(r.date), ts: +r.ts > 0 ? +r.ts : 0 };
  }
  function toDoc(r) { return { who: r.who, amount: r.amount, subject: r.subject, date: r.date, ts: r.ts }; }
  // Orden cronológico: fecha, luego momento de registro.
  function chrono(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts !== b.ts ? a.ts - b.ts : (a.id < b.id ? -1 : 1); }
  function sortItems() { items.sort(function (a, b) { return chrono(b, a); }); }
  function find(id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }

  function loadLocal() {
    var list = [];
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) JSON.parse(raw).forEach(function (r) { var n = norm(r); if (n) list.push(n); });
    } catch (e) {}
    items = list; sortItems();
  }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); if (window.PanelCasa) PanelCasa.changed(); return true; } catch (e) { return false; } }

  async function commit(ups, rems) {
    rems = rems || [];
    var next = items.filter(function (r) { return rems.indexOf(r.id) < 0 && !ups.some(function (u) { return u.id === r.id; }); }).concat(ups);
    if (mode === 'db' && db) {
      try {
        for (var i = 0; i < ups.length; i++) await db.collection('aportes').doc(ups[i].id).set(toDoc(ups[i]));
        for (var j = 0; j < rems.length; j++) await db.collection('aportes').doc(rems[j]).delete();
      } catch (e) { toast('No se pudo guardar. Intenta de nuevo.'); return false; }
    }
    var prev = items;
    items = next; sortItems();
    if (mode !== 'db' && !saveLocal()) { items = prev; toast('No se pudo guardar en este dispositivo.'); return false; }
    render();
    return true;
  }

  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  /* ---------- Cálculos ---------- */
  function totals() {
    var month = todayKey().slice(0, 7);
    var t = { all: 0 };
    ORDER.forEach(function (w) { t[w] = { total: 0, n: 0, month: 0 }; });
    items.forEach(function (r) {
      t[r.who].total += r.amount; t[r.who].n += 1; t.all += r.amount;
      if (r.date.slice(0, 7) === month) t[r.who].month += r.amount;
    });
    return t;
  }
  // Total acumulado de cada persona después de cada aporte.
  function running() {
    var acc = {}, map = {};
    items.slice().sort(chrono).forEach(function (r) { acc[r.who] = (acc[r.who] || 0) + r.amount; map[r.id] = acc[r.who]; });
    return map;
  }
  function suggestions() {
    var seen = {}, list = [];
    items.forEach(function (r, i) {
      if (!r.subject) return;
      var k = r.subject.toLowerCase();
      if (!seen[k]) { seen[k] = { label: r.subject, n: 0, first: i }; list.push(seen[k]); }
      seen[k].n += 1;
    });
    list.sort(function (a, b) { return b.n - a.n || a.first - b.first; });
    var out = list.slice(0, 5).map(function (s) { return s.label; });
    DEFAULT_SUGS.forEach(function (d) { if (out.length < 3 && !seen[d.toLowerCase()]) out.push(d); });
    return out;
  }

  /* ---------- Vistas ---------- */
  function sizeClass(txt) { return txt.length >= 10 ? ' s3' : txt.length >= 8 ? ' s2' : ''; }

  function renderTotals() {
    var t = totals();
    var h = '<div class="tiles">';
    ORDER.forEach(function (w) {
      var txt = loading ? '—' : money(t[w].total);
      var sub = loading ? 'Buscando tus registros…' : (t[w].n ? 'Este mes ' + money(t[w].month) + '<br>' + t[w].n + ' ' + plural(t[w].n, 'aporte', 'aportes') + ' en total' : 'Sin aportes aún');
      h += '<div class="tile ' + w + (bumpWho === w ? ' bump' : '') + '"><span class="person">' + PEOPLE[w] + '</span>' +
        '<div class="big' + sizeClass(txt) + '" aria-label="Total ' + PEOPLE[w] + ': ' + txt + '">' + txt + '</div><div class="sub">' + sub + '</div></div>';
    });
    h += '</div>';
    if (!loading) h += '<p class="grand">Total entregado a las dos: <strong>' + money(t.all) + '</strong></p>';
    totalsEl.innerHTML = h;
    bumpWho = null;
  }

  function renderSugs() {
    $('f-sugs').innerHTML = suggestions().map(function (s) { return '<button type="button" class="sug" data-sug="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
  }

  function renderHistory() {
    var h = '<div class="hist"><div class="sec-head"><h2>Historial</h2><div class="filter" role="group" aria-label="Filtrar historial">';
    [['all', 'Todos'], ['piti', 'Piti'], ['emi', 'Emi']].forEach(function (f) {
      h += '<button type="button" class="fchip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
    });
    h += '</div></div>';
    var list = filter === 'all' ? items : items.filter(function (r) { return r.who === filter; });
    if (loading) {
      h += '<p class="empty">Buscando tus registros…</p>';
    } else if (!list.length) {
      h += '<p class="empty">' + (items.length ? 'No hay aportes para ' + PEOPLE[filter] + '.' : 'Aún no hay aportes. Cada monto que registres aparecerá aquí con su asunto y el total acumulado.') + '</p>';
    } else {
      var run = running(), sums = {};
      list.forEach(function (r) { var m = r.date.slice(0, 7); sums[m] = (sums[m] || 0) + r.amount; });
      var cur = '', open = false;
      list.slice(0, shown).forEach(function (r) {
        var m = r.date.slice(0, 7);
        if (m !== cur) {
          if (open) h += '</ul>';
          h += '<h3 class="month">' + monthLabel(r.date) + '<span>' + money(sums[m]) + '</span></h3><ul class="list">';
          cur = m; open = true;
        }
        var name = PEOPLE[r.who], subj = r.subject || 'Sin asunto';
        h += '<li><button type="button" class="row" data-edit="' + r.id + '" aria-label="Editar aporte: ' + money(r.amount) + ' para ' + name + ', ' + esc(subj) + ', ' + fmtDay(r.date) + '">' +
          '<div class="info"><span class="subj">' + esc(subj) + '</span><span class="meta"><span class="person ' + r.who + '">' + name + '</span>' + fmtDay(r.date) + '</span></div>' +
          '<div class="amt"><b>' + money(r.amount) + '</b><span>Total ' + money(run[r.id]) + '</span></div>' + I_CHEV + '</button></li>';
      });
      if (open) h += '</ul>';
      if (list.length > shown) h += '<button type="button" class="btn ghost block" data-more="1">Ver aportes anteriores</button>';
    }
    historyEl.innerHTML = h + '</div>';
  }

  function renderBackup() {
    if (window.claude || backupEl.firstChild) return;
    backupEl.innerHTML = '<details class="backup"><summary>Respaldo de datos</summary>' +
      '<p class="muted">Los aportes se guardan solo en este dispositivo. Copia un respaldo para guardarlo en Notas o llevarlo a otro equipo.</p>' +
      '<textarea id="bk-text" rows="4" spellcheck="false" aria-label="Texto del respaldo"></textarea>' +
      '<div class="bk-actions"><button type="button" class="btn ghost" data-bk="copy">Copiar respaldo</button><button type="button" class="btn ghost" data-bk="restore">Restaurar desde el texto</button></div></details>';
  }

  function render() { renderTotals(); renderSugs(); renderHistory(); renderBackup(); }

  /* ---------- Campos compartidos por el formulario y la hoja ---------- */
  function onAmountInput(ev) {
    var el = ev.target;
    if (!el || !el.classList || !el.classList.contains('js-amount')) return;
    var n = parseAmount(el.value);
    el.value = n ? dots(n) : '';
  }
  function readFields(p, root) {
    var whoEl = root.querySelector('input[name="' + p + '-who"]:checked');
    return { amount: parseAmount($(p + '-amount').value), who: whoEl ? whoEl.value : '', subject: cleanSubject($(p + '-subject').value), date: $(p + '-date').value };
  }
  function check(f) {
    if (!f.amount) return 'Escribe el monto, por ejemplo 10.000.';
    if (!PEOPLE[f.who]) return 'Elige si el monto es para Piti o para Emi.';
    if (!f.subject) return 'Escribe el asunto, por ejemplo almuerzo.';
    if (!DATE_RE.test(f.date)) return 'Indica la fecha.';
    if (f.date > todayKey()) return 'La fecha no puede ser futura.';
    return '';
  }
  function setErr(id, msg) { var e = $(id); if (e) { e.textContent = msg; e.hidden = !msg; } }

  /* ---------- Nuevo aporte ---------- */
  $('f-amount').classList.add('js-amount');
  document.addEventListener('input', onAmountInput);

  function syncAccent() {
    var w = formEl.querySelector('input[name="f-who"]:checked');
    formEl.classList.toggle('sel-piti', !!w && w.value === 'piti');
    formEl.classList.toggle('sel-emi', !!w && w.value === 'emi');
  }
  formEl.addEventListener('change', function (ev) { if (ev.target.name === 'f-who') syncAccent(); });
  formEl.addEventListener('input', function () { setErr('f-err', ''); });
  formEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-sug]');
    if (!b) return;
    $('f-subject').value = b.getAttribute('data-sug');
    setErr('f-err', '');
  });

  function resetForm() {
    formEl.reset();
    lastToday = todayKey();
    $('f-date').value = lastToday; $('f-date').max = lastToday;
    syncAccent(); setErr('f-err', '');
  }

  formEl.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (busy || loading) return;
    var f = readFields('f', formEl), msg = check(f);
    if (msg) { setErr('f-err', msg); return; }
    var rec = { id: genId(), who: f.who, amount: f.amount, subject: f.subject, date: f.date, ts: Date.now() };
    busy = true; bumpWho = f.who;
    var ok = await commit([rec], []);
    busy = false;
    if (!ok) { bumpWho = null; return; }
    var name = PEOPLE[f.who];
    resultEl.className = 'result ' + f.who;
    resultEl.innerHTML = 'Registrado: <strong>' + money(f.amount) + '</strong> para ' + name + ' · ' + esc(f.subject) +
      '<span class="new">Nuevo total ' + name + ': ' + money(totals()[f.who].total) + '</span>';
    resultEl.hidden = false;
    resetForm();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
  });

  /* ---------- Historial ---------- */
  historyEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-filter')) { filter = b.getAttribute('data-filter'); shown = PAGE; renderHistory(); }
    else if (b.hasAttribute('data-more')) { shown += PAGE; renderHistory(); }
    else if (b.hasAttribute('data-edit')) openSheet(b.getAttribute('data-edit'));
  });

  /* ---------- Hoja para editar o eliminar ---------- */
  function openSheet(id) {
    var r = find(id);
    if (!r) return;
    sheet = { id: id, del: false };
    var today = todayKey();
    var who = '';
    ORDER.forEach(function (w) {
      who += '<input type="radio" name="e-who" id="e-who-' + w + '" value="' + w + '"' + (r.who === w ? ' checked' : '') + '><label for="e-who-' + w + '" class="' + w + '">' + PEOPLE[w] + '</label>';
    });
    sheetEl.innerHTML = '<div class="backdrop" data-act="cancel"></div>' +
      '<form class="panel sel-' + r.who + '" id="sheet-form" novalidate role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' +
      '<h2 id="sheet-title">Editar aporte</h2>' +
      '<label class="field"><span>Monto</span><div class="amount-wrap"><b>$</b><input type="text" id="e-amount" class="js-amount" inputmode="numeric" autocomplete="off" value="' + dots(r.amount) + '"></div></label>' +
      '<fieldset class="field"><legend>Para</legend><div class="who">' + who + '</div></fieldset>' +
      '<label class="field"><span>Asunto</span><input type="text" id="e-subject" maxlength="40" autocomplete="off" autocapitalize="sentences" value="' + esc(r.subject) + '"></label>' +
      '<label class="field inline"><span>Fecha</span><input type="date" id="e-date" value="' + r.date + '" max="' + today + '"></label>' +
      '<p class="err" id="e-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="submit" class="btn primary block">Guardar cambios</button>' +
      '<button type="button" class="btn danger block" data-act="delete">Eliminar aporte</button>' +
      '<button type="button" class="btn ghost block" data-act="cancel">Cancelar</button></div></form>';
    sheetEl.hidden = false;
    document.documentElement.classList.add('lock');
    $('sheet-form').focus();
  }
  function closeSheet() {
    sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = '';
    document.documentElement.classList.remove('lock');
  }

  sheetEl.addEventListener('change', function (ev) {
    if (ev.target.name !== 'e-who') return;
    var p = $('sheet-form');
    p.classList.toggle('sel-piti', ev.target.value === 'piti');
    p.classList.toggle('sel-emi', ev.target.value === 'emi');
  });

  sheetEl.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || !sheet) return;
    var a = b.getAttribute('data-act');
    if (a === 'cancel') { closeSheet(); return; }
    if (a === 'delete') {
      var r = find(sheet.id);
      if (!r) { closeSheet(); return; }
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para eliminar'; b.classList.add('armed'); return; }
      if (busy) return; busy = true;
      var ok = await commit([], [r.id]); busy = false;
      if (ok) { closeSheet(); resultEl.hidden = true; toast('Aporte eliminado. Total ' + PEOPLE[r.who] + ': ' + money(totals()[r.who].total)); }
    }
  });

  sheetEl.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!sheet || busy) return;
    var r = find(sheet.id);
    if (!r) { closeSheet(); return; }
    var f = readFields('e', sheetEl), msg = check(f);
    if (msg) { setErr('e-err', msg); return; }
    busy = true; bumpWho = f.who;
    var ok = await commit([{ id: r.id, who: f.who, amount: f.amount, subject: f.subject, date: f.date, ts: r.ts }], []);
    busy = false;
    if (!ok) { bumpWho = null; return; }
    closeSheet(); resultEl.hidden = true;
    toast('Cambios guardados. Total ' + PEOPLE[f.who] + ': ' + money(totals()[f.who].total));
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheet) closeSheet(); });

  /* ---------- Respaldo ---------- */
  backupEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-bk]');
    if (!b) return;
    var ta = $('bk-text');
    if (b.getAttribute('data-bk') === 'copy') {
      var json = JSON.stringify(items.slice().sort(chrono));
      ta.value = json;
      var manual = function () { ta.focus(); ta.select(); toast('Selecciona el texto y cópialo'); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function () { toast('Respaldo copiado'); }, manual);
        else manual();
      } catch (e) { manual(); }
      return;
    }
    var list = [];
    try {
      var data = JSON.parse(ta.value);
      if (!Array.isArray(data)) throw new Error('formato');
      data.forEach(function (r) { var n = norm(r); if (n) list.push(n); });
    } catch (e) { toast('El texto no es un respaldo válido'); return; }
    if (!list.length) { toast('El respaldo no tiene aportes válidos'); return; }
    if (items.length && !restoreArmed) {
      restoreArmed = true; b.textContent = 'Toca de nuevo para reemplazar';
      toast('Esto reemplaza los aportes de este dispositivo');
      return;
    }
    restoreArmed = false; b.textContent = 'Restaurar desde el texto';
    items = list; sortItems(); saveLocal(); resultEl.hidden = true; render();
    toast('Respaldo restaurado');
  });

  /* ---------- Arranque ---------- */
  function fallback() { mode = 'local'; db = null; loading = false; loadLocal(); render(); }

  async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      db = await window.claude.use('db');
      if (!db) { fallback(); return; }
      mode = 'db';
      db.collection('aportes').onSnapshot(function (snap) {
        var list = [];
        snap.docs.forEach(function (doc) {
          var n = norm(Object.assign({}, doc.data() || {}, { id: doc.id }));
          if (n) list.push(n);
        });
        items = list; sortItems(); loading = false; render();
      }, function () { fallback(); });
    } catch (e) { fallback(); }
  }

  // Una app instalada puede quedar abierta varios días: al volver, se actualiza el día de hoy.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var t = todayKey();
    if (t === lastToday) return;
    var d = $('f-date');
    if (!d.value || d.value === lastToday) d.value = t;
    d.max = t; lastToday = t;
    renderTotals();
  });

  if (!loading) loadLocal();
  resetForm();
  render();
  connect();

  if (!window.claude && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
/*PANEL:APP:START*/
  // Panel Casa: totales de cada una, lo del mes y los tres últimos aportes
  if (window.PanelCasa) PanelCasa.init({ app: 'mesadas', title: 'Mesadas · panel', mount: document.getElementById('panel-casa'), summary: function () {
    var d = new Date(), ym = d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1);
    var tot = { piti: 0, emi: 0 }, mes = { ym: ym, piti: 0, emi: 0 };
    items.forEach(function (r) { if (tot[r.who] == null) return; tot[r.who] += r.amount; if (r.date.slice(0, 7) === ym) mes[r.who] += r.amount; });
    return { tot: tot, mes: mes, ult: items.slice(0, 3).map(function (r) { return { w: r.who, m: r.amount, s: r.subject, d: r.date }; }) };
  } });
/*PANEL:APP:END*/
})();
</script>

</body>
</html>
